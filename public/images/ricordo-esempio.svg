<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Segnaposto per una foto ricordo">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#58c4f2"/>
      <stop offset="0.45" stop-color="#9adcf9"/>
      <stop offset="0.78" stop-color="#ffd9e8"/>
      <stop offset="1" stop-color="#fff0bd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c4dd6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="1030" cy="110" r="260" fill="url(#sun)"/>

  <g fill="#ffffff" opacity="0.22">
    <ellipse cx="160" cy="190" rx="220" ry="90"/>
    <ellipse cx="1010" cy="700" rx="260" ry="100"/>
    <ellipse cx="420" cy="820" rx="200" ry="80"/>
  </g>

  <g fill="#ffffff" opacity="0.8">
    <text x="140" y="170" font-family="'Baloo 2', 'Nunito', sans-serif" font-size="60" font-weight="800">✦</text>
    <text x="980" y="300" font-family="'Baloo 2', 'Nunito', sans-serif" font-size="42" font-weight="800">✦</text>
    <text x="820" y="160" font-family="'Baloo 2', 'Nunito', sans-serif" font-size="30" font-weight="800">✦</text>
    <text x="250" y="760" font-family="'Baloo 2', 'Nunito', sans-serif" font-size="36" font-weight="800">✦</text>
  </g>

  <rect x="90" y="90" width="1020" height="720" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="20 18"/>

  <g filter="url(#soft)">
    <rect x="330" y="250" width="540" height="400" rx="36" fill="#ffffff" opacity="0.92"/>
    <rect x="330" y="250" width="540" height="400" rx="36" fill="none" stroke="#ffd0e3" stroke-width="8"/>

    <g transform="translate(600 420)" fill="none" stroke="#ff4f8b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-96" y="-58" width="192" height="136" rx="24"/>
      <path d="M-44 -58l16 -24h56l16 24"/>
      <circle cx="0" cy="10" r="42" fill="#ffe4ef"/>
      <circle cx="0" cy="10" r="24"/>
    </g>

    <text x="600" y="590" text-anchor="middle" font-family="'Baloo 2', 'Nunito', sans-serif" font-size="54" font-weight="800" fill="#3d3452">La vostra foto qui</text>
    <text x="600" y="642" text-anchor="middle" font-family="'Nunito', sans-serif" font-size="30" font-weight="700" fill="#7c7590">Sostituisci il file in public/images/</text>
  </g>

  <g font-family="'Nunito', sans-serif" font-weight="800" text-anchor="middle">
    <rect x="360" y="712" width="480" height="70" rx="35" fill="#ff4f8b"/>
    <text x="600" y="758" font-size="28" fill="#ffffff">Aggiorna lo step «Un ricordo»</text>
  </g>
</svg>
